name: release

# 推 v 开头的 tag 就出一个 Release；手动触发只出 artifact，方便试打包
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # 建 Release 要写权限

jobs:
  build:
    runs-on: windows-latest  # 只能在 Windows 上打，PyInstaller 不能交叉编译
    steps:
      - uses: actions/checkout@v4

      - name: 写入版本号（tag 用 tag 名，手动触发用短 SHA）
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { $env:GITHUB_SHA.Substring(0, 7) }
          Set-Content -Path app/version.py -Value ('VERSION = "' + $ver + '"') -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 装依赖
        run: python -X utf8 -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: 测试并打包
        id: pack
        shell: pwsh
        run: ./tools/build_release.ps1 -PythonExecutable (Get-Command python).Source

      - name: 上传构建产物
        if: always()  # 失败时也把已经有的东西捞上来
        uses: actions/upload-artifact@v4
        with:
          name: jev-chat-windows
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: warn

      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.zip }}
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: true
          generate_release_notes: false
